<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — Moo-d Board</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --text:#2c1810; --dim:#8b7355;
    --gold:#d4a04a; --red:#d46a6a; --green:#5a9c69; --spot1:#d4a04a; --spot2:#c48450;
    --radius:16px; --radius-sm:10px; --shadow:0 2px 12px rgba(0,0,0,0.08);
  }
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--gold:#c48450;--red:#c44a4a;--green:#4a7c59;--shadow:0 2px 12px rgba(0,0,0,0.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;transition:background .3s,color .3s}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px}
  .row{display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;box-shadow:var(--shadow)}
  /* streak */
  .streak{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff3d6,#ffe9c2);border:1px solid var(--gold);border-radius:var(--radius-sm);padding:8px 12px;margin:6px 0 12px;font-size:.78rem;font-weight:700;color:#8a5a1a}
  body.dark .streak{background:linear-gradient(135deg,#2a2010,#33260f);color:var(--gold);border-color:var(--spot1)}
  .streak .flame{font-size:1.05rem;animation:wig 1.6s infinite}
  @keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
  /* hero cow */
  .sacred{position:relative;margin:0 0 14px;background:linear-gradient(135deg,var(--spot2),var(--gold));border-radius:var(--radius);padding:16px;color:#fff;box-shadow:var(--shadow);overflow:hidden}
  .sacred::after{content:"🐄";position:absolute;right:-6px;bottom:-16px;font-size:70px;opacity:.2;transform:rotate(-10deg)}
  .seal{position:absolute;top:12px;right:12px;background:#fff;color:var(--spot2);font-size:.6rem;font-weight:900;letter-spacing:.08em;border-radius:999px;padding:4px 10px;transform:rotate(6deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .sacred .kick{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
  .sacred h2{font-size:1.15rem;margin:4px 0 2px}
  .sacred .sub{font-size:.78rem;opacity:.95}
  /* mood board */
  .moods-label{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:4px 0 8px}
  .moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
  .mood{background:var(--card);border:2px solid rgba(0,0,0,.08);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
  body.dark .mood{border-color:rgba(255,255,255,.1)}
  .mood .face{font-size:1.5rem;display:block;margin-bottom:4px;transition:transform .2s}
  .mood .name{font-size:.62rem;font-weight:800;line-height:1.15}
  .mood.on{border-color:var(--spot2);background:linear-gradient(180deg,var(--card),#fdf0dc)}
  .mood.on .face{transform:scale(1.18)}
  body.dark .mood.on{background:linear-gradient(180deg,#241a12,#2a1f14)}
  /* heatmap */
  .hm-wrap{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:14px;box-shadow:var(--shadow)}
  .hm-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--dim);margin-bottom:8px}
  .hm{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
  .hm .cell{height:26px;border-radius:5px;background:#f0e6d6;cursor:pointer;position:relative;transition:transform .12s}
  body.dark .hm .cell{background:#2a2118}
  .hm .cell:hover{transform:scale(1.12)}
  .hm .cell.golden{outline:2px solid var(--gold);outline-offset:1px;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,74,.5)}50%{box-shadow:0 0 0 5px rgba(212,160,74,0)}}
  .hm-legend{display:flex;justify-content:space-between;font-size:.6rem;color:var(--dim);font-weight:700;margin-top:6px}
  /* venues */
  .venue{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
  .venue.soon{border-left-color:var(--gold)}.venue.done{border-left-color:#bbb;opacity:.7}
  .vtop{display:flex;align-items:baseline;gap:8px}
  .vname{font-weight:800;font-size:1rem}
  .vtags{font-size:.68rem;color:var(--dim);font-weight:600}
  .vstatus{margin-left:auto;font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .live .vstatus{background:var(--green);color:#fff}
  .soon .vstatus{background:var(--gold);color:#fff}
  .done .vstatus{background:#ccc;color:#555}
  .vhours{font-size:.75rem;color:var(--dim);font-weight:600;margin:6px 0 8px}
  .crowd{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--dim);font-weight:700;margin-bottom:6px}
  .crowd .c{color:var(--spot2);letter-spacing:-2px;font-size:.95rem}
  .special{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed rgba(0,0,0,.08);font-size:.82rem}
  body.dark .special{border-color:rgba(255,255,255,.08)}
  .special .item{font-weight:600}.special .price{font-weight:800;color:var(--spot2);white-space:nowrap}
  .filter-note{font-size:.72rem;font-weight:700;color:var(--spot2);margin:0 0 10px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--spot2);color:#fff;padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div class="logo">🐄 Happy <span>Cow</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn">🌙</button>
    </div>
  </header>

  <div class="streak"><span class="flame">🔥</span> Bessie missed you — Day <b id="streakDay">3</b> in a row. Herd's waiting.</div>

  <div class="sacred" id="sacredCard">
    <div class="seal">MOO-T APPROVED</div>
    <div class="kick">🐄 Sacred Cow of the Day</div>
    <h2 id="sacredName">Loading…</h2>
    <div class="sub" id="sacredSub"></div>
  </div>

  <div class="moods-label">Don't search by tag — search by vibe</div>
  <div class="moods" id="moods"></div>

  <div class="hm-wrap">
    <div class="hm-label"><span>🐄 Happy Hour Heatmap</span><span id="hmSel">tap a block</span></div>
    <div class="hm" id="hm"></div>
    <div class="hm-legend"><span>2pm</span><span>golden hour</span><span>10pm</span></div>
  </div>

  <div class="filter-note" id="filterNote" hidden></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOW=new Date('2026-08-05T17:12:00');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=DAYS[NOW.getDay()];

const VENUES=[
  {id:'ale-works',name:'Ale Works',tags:['downtown','craft-beer'],hours:'Daily 4-6pm',mood:['chill'],crowd:3,specials:[{i:'Draft beers',p:0,d:'$1.00 off'},{i:'Wine by the glass',p:0,d:'$1.00 off'}]},
  {id:'bar-ix',name:'Bar IX',tags:['dive'],hours:'Daily 2-7pm',mood:['cheap','rowdy'],crowd:5,specials:[{i:'Two drinks for one',p:0,d:'2-4-1'},{i:'Well drinks',p:0,d:'2-for-1'}]},
  {id:'bitterroot',name:'Bitterroot Bistro',tags:['classy'],hours:'Daily 2-5pm',mood:['date'],crowd:2,specials:[{i:'Beef pasty',p:15,d:'MT Wagyu'},{i:'Bison tartare',p:13,d:''}]},
  {id:'blackbird',name:'Blackbird',tags:['downtown','classy'],hours:'Daily 4:30-5:30pm',mood:['date'],crowd:2,specials:[{i:'Wine bottles',p:0,d:'Half price'}]},
  {id:'bourbon',name:'Bourbon',tags:['whiskey','downtown'],hours:'Daily 4-6pm',mood:['chill'],crowd:3,specials:[{i:'BBQ favorites',p:0,d:'Food specials'},{i:'Whiskey cocktails',p:0,d:''}]},
  {id:'brigade',name:'Brigade',tags:['downtown'],hours:'Daily 3-6pm',mood:['chill','date'],crowd:2,specials:[{i:'Martinis',p:3,d:'Berry, cosmo, gin'}]},
  {id:'devils',name:'Devils Toboggan',tags:['downtown'],hours:'Daily 4-6pm',mood:['rowdy'],crowd:4,specials:[{i:'Beers',p:3,d:''},{i:'Wine',p:4,d:''}]},
  {id:'dry-hills',name:'Dry Hills Distillery',tags:['whiskey'],hours:'Tue 4-8pm',mood:['chill'],crowd:2,specials:[{i:'All cocktails',p:2,d:''}]},
  {id:'finks',name:'Finks Deli',tags:['downtown'],hours:'Daily 2-4pm',mood:['cheap'],crowd:3,specials:[{i:'Beer',p:3,d:''},{i:'Sandwiches',p:0,d:'Half off'}]},
  {id:'la-brasserie',name:'La Brasserie',tags:['classy'],hours:'Daily 4-6pm',mood:['date'],crowd:2,specials:[{i:'Select wines',p:6,d:''}]},
  {id:'revelry',name:'Revelry',tags:['downtown'],hours:'Daily 2:30-4pm',mood:['cheap','rowdy'],crowd:4,specials:[{i:'Rainier',p:2,d:'Tallboys'},{i:'Well drinks',p:3,d:''}]},
  {id:'rocking-r',name:'Rocking R Bar',tags:['dive','western'],hours:'Mon-Fri 4-7pm',mood:['rowdy'],crowd:5,specials:[{i:'Drafts',p:4,d:''},{i:'Wings',p:0,d:'50¢ wings'}]},
  {id:'shine',name:'Shine Beer Sanctuary',tags:['craft-beer'],hours:'Daily 3-5pm',mood:['chill'],crowd:2,specials:[{i:'Local pints',p:4,d:''},{i:'Flights',p:0,d:'2-for-1'}]},
  {id:'bacchus',name:'The Bacchus Pub',tags:['pub'],hours:'Daily 2-6pm',mood:['chill','cheap'],crowd:3,specials:[{i:'Well drinks',p:3.5,d:''},{i:'Domestic pints',p:4,d:''}]},
  {id:'club-tavern',name:'The Club Tavern',tags:['pub','sports'],hours:'Mon-Fri 4-7pm',mood:['rowdy'],crowd:4,specials:[{i:'Draft beer',p:1,d:'$1 drafts'}]},
  {id:'urban-kitchen',name:'Urban Kitchen',tags:['classy'],hours:'Daily 3-6pm',mood:['date'],crowd:2,specials:[{i:'Wines by the glass',p:2,d:''},{i:'Small plates',p:0,d:'Half off'}]},
  {id:'pour-house',name:'The Pour House',tags:['downtown'],hours:'Mon-Fri 2-6pm',mood:['cheap','chill'],crowd:3,specials:[{i:'Micro drafts',p:3.75,d:''}]},
  {id:'old-chicago',name:'Old Chicago',tags:['pub'],hours:'Mon-Fri 4-7pm',mood:['cheap'],crowd:3,specials:[{i:'Domestic bottles',p:2.5,d:''}]},
  {id:'bww',name:'Buffalo Wild Wings',tags:['sports'],hours:'Mon-Fri 3-6pm',mood:['rowdy'],crowd:4,specials:[{i:'Strawberry margarita',p:6,d:''}]},
  {id:'copper',name:'Copper Whiskey Bar',tags:['whiskey'],hours:'Mon-Fri 3-5pm, Sun all day',mood:['chill'],crowd:3,specials:[{i:'Draft beer',p:5,d:''},{i:'Whiskey flights',p:0,d:'$5 off'}]},
];

const MOODS=[
  {k:'cheap',face:'🤑',name:'Cheap Thrills',tags:['dive','pub']},
  {k:'date',face:'💕',name:'Date Night',tags:['classy','downtown']},
  {k:'rowdy',face:'🤪',name:'Rowdy',tags:['sports','western','dive']},
  {k:'chill',face:'😌',name:'Chill Vibes',tags:['craft-beer','whiskey']},
  {k:'day',face:'☀️',name:'Day Drinking',tags:[]},
];

function toMin(s){const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3].toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mi;}
function windowsOf(hoursStr){
  const wins=[];
  for(const part of hoursStr.split(',')){
    const m=part.trim().match(/^([A-Za-z,\- ]+?)\s+(\d[^ ]*(?:-\d[^ ]*)?(?:\s*[ap]m)?)(?:\s*&?\s*(\d[^ ]*(?:-\d[^ ]*)?\s*[ap]m)?)?$/i);
    if(!m)continue;
    const days=m[1].trim(),daySet=new Set();
    if(/daily/i.test(days)){DAYS.forEach(d=>daySet.add(d));}
    else{for(const range of days.split(/\s+(?=[A-Z])/)){const r=range.match(/^([A-Z][a-z]{2})(?:-([A-Z][a-z]{2}))?$/);if(!r)continue;const a=DAYS.indexOf(r[1]),b=r[2]?DAYS.indexOf(r[2]):a;let i=a;for(;;){daySet.add(DAYS[i]);if(i===b)break;i=(i+1)%7;if(i===a)break;}}}
    const times=[m[2],m[3]].filter(Boolean).map(r=>{const mm=r.match(/^(\d{1,2}(?::\d{2})?)(?:\s*(am|pm))?\s*-\s*(?:(\d{1,2}(?::\d{2})?)\s*(am|pm)|(close))$/i);if(!mm)return null;const es=mm[4]||mm[5];const end=es==='close'?1439:toMin(mm[3]+' '+es);const ss=mm[2]||(es==='pm'?'pm':(+mm[1].split(':')[0]<12?'pm':'am'));return[toMin(mm[1]+' '+ss),end];}).filter(Boolean);
    for(const [s,e] of times)wins.push({days:daySet,s,e});
  }
  return wins;
}
function status(v){
  const wins=windowsOf(v.hours);
  if(!wins.length)return{key:'done',label:'No HH listed'};
  const h=NOW.getHours()*60+NOW.getMinutes();
  let best=null;
  for(const w of wins){
    if(!w.days.has(DAY))continue;
    if(h>=w.s&&h<=w.e)return{key:'live',label:'LIVE now'};
    const until=w.s-h;
    if(until>0&&(best===null||until<best))best=until;
  }
  if(best!==null)return{key:'soon',label:best<=120?`Opens in ${best}m`:`Opens in ${Math.round(best/60)}h`};
  return{key:'done',label:'Closed today'};
}
function priceLabel(sp){
  if(sp.p>0)return'$'+sp.p.toFixed(2).replace(/\.00$/,'');
  if(/off|discount|half|bogo|special|price|deal|2 for 1|2-4-1|one free|\$|cents|%/i.test(sp.d||''))return'—';
  return'FREE';
}
// heatmap: venues live per half-hour (2pm-10pm = 16 blocks)
function liveAt(min){return VENUES.filter(v=>windowsOf(v.hours).some(w=>w.days.has(DAY)&&min>=w.s&&min<=w.e)).length;}
const B0=14*60; // 2pm
const hmData=Array.from({length:16},(_,i)=>liveAt(B0+i*30));

// sacred cow of the day: seeded by date
function seeded(s){let x=s%2147483647;if(x<=0)x+=2147483646;return()=>{x=x*16807%2147483647;return(x-1)/2147483646;};}
function pickSacred(){
  const dayNum=Math.floor(NOW.getTime()/86400000);
  const rng=seeded(dayNum*9301+49297);
  const live=VENUES.filter(v=>status(v).key!=='done');
  return (live.length?live:VENUES)[Math.floor(rng()*Math.max(1,live.length))];
}

let activeMood=null,hmFilter=null;

function renderMoods(){
  const el=document.getElementById('moods');el.innerHTML='';
  for(const m of MOODS){
    const b=document.createElement('button');
    b.className='mood'+(activeMood===m.k?' on':'');
    b.innerHTML=`<span class="face">${m.face}</span><span class="name">${m.name}</span>`;
    b.onclick=()=>{activeMood=activeMood===m.k?null:m.k;hmFilter=null;updateHM();render();};
    el.appendChild(b);
  }
}
function updateHM(){
  const el=document.getElementById('hm');el.innerHTML='';
  const max=Math.max(...hmData,1);
  const golden=hmData.indexOf(Math.max(...hmData));
  hmData.forEach((n,i)=>{
    const c=document.createElement('div');
    c.className='cell'+(i===golden?' golden':'');
    const intensity=n/max;
    c.style.background=`rgba(196,132,80,${0.12+intensity*0.88})`;
    c.title=`${2+Math.floor(i/2)}:${i%2?30:0}0 — ${n} venues`;
    c.onclick=()=>{hmFilter=hmFilter===i?null:i;activeMood=null;renderMoods();updateHM();render();};
    el.appendChild(c);
  });
  document.getElementById('hmSel').textContent=hmFilter===null?'tap a block':`${2+Math.floor(hmFilter/2)}:${hmFilter%2?30:0}0 only`;
}
function render(){
  let list=[...VENUES];
  if(activeMood){
    const mood=MOODS.find(m=>m.k===activeMood);
    if(mood.tags.length)list=list.filter(v=>v.tags.some(t=>mood.tags.includes(t)));
    else list=list.filter(v=>status(v).key==='live'); // day drinking = currently live
  }
  if(hmFilter!==null){
    const min=B0+hmFilter*30;
    list=list.filter(v=>windowsOf(v.hours).some(w=>w.days.has(DAY)&&min>=w.s&&min<=w.e));
  }
  const note=document.getElementById('filterNote');
  if(activeMood||hmFilter!==null){note.hidden=false;note.textContent=(activeMood?`Vibe: ${MOODS.find(m=>m.k===activeMood).name} `:'')+(hmFilter!==null?`@ ${2+Math.floor(hmFilter/2)}:${hmFilter%2?30:0}0`:'')+` — ${list.length} spots`;}
  else note.hidden=true;
  document.getElementById('list').innerHTML=list.map(v=>{
    const st=status(v);
    const crowd='🐮'.repeat(v.crowd)+'<span style="opacity:.25">'+'🐮'.repeat(5-v.crowd)+'</span>';
    const sp=v.specials.map(s=>`<div class="special"><span class="item">${s.i}</span><span class="price">${priceLabel(s)}</span></div>`).join('');
    return `<div class="venue ${st.key}"><div class="vtop"><span class="vname">${v.name}</span><span class="vtags">${v.tags.join(' · ')}</span><span class="vstatus">${st.label}</span></div>
    <div class="vhours">🕒 ${v.hours}</div><div class="crowd">Moo-ter: <span class="c">${crowd}</span> (${v.crowd}/5)</div>${sp}</div>`;
  }).join('')||'<p style="color:var(--dim);font-size:.85rem;text-align:center;padding:30px 0">🐄 No spots match this vibe. Try a different mood.</p>';

  const sacred=pickSacred();
  document.getElementById('sacredName').textContent=sacred.name;
  const priced=sacred.specials.filter(s=>s.p>0);
  const from=priced.length?`from $${priced.map(s=>s.p).reduce((a,b)=>Math.min(a,b),99)}`:'specials on now';
  document.getElementById('sacredSub').textContent=`${sacred.tags.join(' · ')} · ${sacred.hours} · ${from}`;
}
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};

renderMoods();updateHM();render();
</script>
</body>
</html>
