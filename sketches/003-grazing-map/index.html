<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — Grazing Map</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --text:#2c1810; --dim:#8b7355;
    --gold:#d4a04a; --red:#d46a6a; --green:#5a9c69; --spot1:#d4a04a; --spot2:#c48450;
    --radius:16px; --radius-sm:10px; --shadow:0 2px 12px rgba(0,0,0,0.08);
  }
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--gold:#c48450;--red:#c44a4a;--green:#4a7c59;--shadow:0 2px 12px rgba(0,0,0,0.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;transition:background .3s,color .3s}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px}
  .row{display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;box-shadow:var(--shadow)}
  /* map */
  .map-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
  .map-card svg{display:block;width:100%;height:auto;background:#f2e9d8;clip-path:inset(0 round var(--radius))}
  body.dark .map-card svg{background:#191209}
  .map-legend{display:flex;gap:12px;padding:8px 12px;font-size:.66rem;font-weight:700;color:var(--dim);border-top:1px solid rgba(0,0,0,.06)}
  body.dark .map-legend{border-color:rgba(255,255,255,.08)}
  .pin-cow{cursor:pointer;transition:transform .15s}
  .pin-cow:hover{transform:scale(1.25)}
  .pin-cow.selected .cow-body{stroke:var(--red);stroke-width:3}
  .pin-label{font-size:9px;font-weight:800;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:#fdf6ec;stroke-width:3}
  body.dark .pin-label{stroke:#120e0a}
  .street{fill:rgba(120,90,50,.55);font-size:8px;font-weight:800;font-family:sans-serif;paint-order:stroke;stroke:#f2e9d8;stroke-width:3}
  body.dark .street{fill:rgba(225,195,155,.65);stroke:#191209}
  .path-line{stroke:var(--red);stroke-width:3;stroke-dasharray:7 5;fill:none;stroke-linecap:round}
  .path-num{font-weight:900;fill:#fff;font-size:10px;text-anchor:middle;dominant-baseline:central}
  .path-num circle{fill:var(--red);stroke:#fff;stroke-width:1.5}
  /* crawl bar */
  .crawl{background:linear-gradient(135deg,var(--spot2),var(--gold));border-radius:var(--radius);padding:12px 14px;color:#fff;margin-bottom:12px;box-shadow:var(--shadow);display:none}
  .crawl.show{display:block}
  .crawl .t{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
  .crawl .body{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
  .crawl .hops{font-size:.82rem;font-weight:700}
  .crawl .stats{margin-left:auto;font-size:.8rem;font-weight:900}
  .crawl button{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:.7rem;font-weight:800;cursor:pointer}
  /* countdown */
  .bell{display:inline-block;animation:ring 1.2s infinite;transform-origin:50% 0}
  @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-18deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
  /* venues */
  .venue{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
  .venue.soon{border-left-color:var(--gold)}.venue.done{border-left-color:#bbb;opacity:.7}
  .vtop{display:flex;align-items:baseline;gap:8px}
  .vname{font-weight:800;font-size:1rem}
  .vstatus{margin-left:auto;font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .live .vstatus{background:var(--green);color:#fff}
  .soon .vstatus{background:var(--gold);color:#fff}
  .done .vstatus{background:#ccc;color:#555}
  .vmeta{font-size:.72rem;color:var(--dim);font-weight:700;margin:4px 0 6px}
  .special{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed rgba(0,0,0,.08);font-size:.82rem}
  body.dark .special{border-color:rgba(255,255,255,.08)}
  .special .item{font-weight:600}.special .price{font-weight:800;color:var(--spot2);white-space:nowrap}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--spot2);color:#fff;padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div class="logo">🐄 Happy <span>Cow</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn">🌙</button>
    </div>
  </header>

  <div class="map-card">
    <svg id="map" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
          <path d="M36 0H0V36" fill="none" stroke="rgba(120,90,50,.14)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="360" height="300" fill="url(#grid)"/>
      <!-- streets -->
      <g stroke="rgba(120,90,50,.35)" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="60" x2="360" y2="60"/><line x1="0" y1="130" x2="360" y2="130"/>
        <line x1="0" y1="200" x2="360" y2="200"/><line x1="0" y1="260" x2="360" y2="260"/>
        <line x1="90" y1="0" x2="90" y2="300"/><line x1="180" y1="0" x2="180" y2="300"/><line x1="270" y1="0" x2="270" y2="300"/>
      </g>
      <g class="street">
        <text x="6" y="52">MAIN ST</text><text x="6" y="122">BABCOCK</text><text x="6" y="192">GRAND</text><text x="6" y="252">MENDEL</text>
        <text x="94" y="262" transform="rotate(90 94 262)">RUSSIAN</text>
        <text x="184" y="262" transform="rotate(90 184 262)">WILLSON</text>
        <text x="274" y="262" transform="rotate(90 274 262)">RIDDLE</text>
      </g>
      <g id="pins"></g>
    </svg>
    <div class="map-legend"><span>🐮 tap cows to pin</span><span>📍 you are here</span><span>1 moo ≈ 1 block</span></div>
  </div>

  <div class="crawl" id="crawl">
    <div class="t">🐾 Cow Path — your crawl</div>
    <div class="body">
      <span class="hops" id="crawlHops"></span>
      <span class="stats" id="crawlStats"></span>
      <button id="crawlClear">clear</button>
    </div>
  </div>

  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOW=new Date('2026-08-05T17:12:00');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=DAYS[NOW.getDay()];

const VENUES=[
  {id:'ale-works',name:'Ale Works',x:120,y:118,hours:'Daily 4-6pm',moos:1,specials:[{i:'Draft beers',p:0,d:'$1.00 off'}]},
  {id:'bar-ix',name:'Bar IX',x:150,y:55,hours:'Daily 2-7pm',moos:2,specials:[{i:'Two drinks for one',p:0,d:'2-4-1'}]},
  {id:'bitterroot',name:'Bitterroot Bistro',x:232,y:190,hours:'Daily 2-5pm',moos:3,specials:[{i:'Beef pasty',p:15,d:''}]},
  {id:'blackbird',name:'Blackbird',x:300,y:125,hours:'Daily 4:30-5:30pm',moos:2,specials:[{i:'Wine bottles',p:0,d:'Half price'}]},
  {id:'bourbon',name:'Bourbon',x:118,y:190,hours:'Daily 4-6pm',moos:1,specials:[{i:'Whiskey cocktails',p:0,d:''}]},
  {id:'brigade',name:'Brigade',x:60,y:190,hours:'Daily 3-6pm',moos:1,specials:[{i:'Martinis',p:3,d:''}]},
  {id:'devils',name:'Devils Toboggan',x:205,y:125,hours:'Daily 4-6pm',moos:1,specials:[{i:'Beers',p:3,d:''}]},
  {id:'dry-hills',name:'Dry Hills',x:280,y:55,hours:'Tue 4-8pm',moos:4,specials:[{i:'All cocktails',p:2,d:''}]},
  {id:'finks',name:'Finks Deli',x:96,y:55,hours:'Daily 2-4pm',moos:2,specials:[{i:'Beer',p:3,d:''}]},
  {id:'la-brasserie',name:'La Brasserie',x:330,y:250,hours:'Daily 4-6pm',moos:3,specials:[{i:'Select wines',p:6,d:''}]},
  {id:'revelry',name:'Revelry',x:150,y:255,hours:'Daily 2:30-4pm',moos:1,specials:[{i:'Rainier',p:2,d:''}]},
  {id:'rocking-r',name:'Rocking R',x:58,y:268,hours:'Mon-Fri 4-7pm',moos:2,specials:[{i:'Drafts',p:4,d:''},{i:'Wings',p:0,d:'50¢'}]},
  {id:'shine',name:'Shine Beer',x:250,y:255,hours:'Daily 3-5pm',moos:3,specials:[{i:'Local pints',p:4,d:''}]},
  {id:'bacchus',name:'Bacchus Pub',x:320,y:60,hours:'Daily 2-6pm',moos:3,specials:[{i:'Well drinks',p:3.5,d:''}]},
  {id:'club-tavern',name:'Club Tavern',x:180,y:60,hours:'Mon-Fri 4-7pm',moos:2,specials:[{i:'Draft beer',p:1,d:'$1 drafts'}]},
  {id:'urban-kitchen',name:'Urban Kitchen',x:300,y:190,hours:'Daily 3-6pm',moos:2,specials:[{i:'Wines',p:2,d:''}]},
  {id:'pour-house',name:'Pour House',x:90,y:125,hours:'Mon-Fri 2-6pm',moos:1,specials:[{i:'Micro drafts',p:3.75,d:''}]},
  {id:'old-chicago',name:'Old Chicago',x:240,y:60,hours:'Mon-Fri 4-7pm',moos:2,specials:[{i:'Domestic bottles',p:2.5,d:''}]},
];

function toMin(s){const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3].toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mi;}
function windowsOf(hoursStr){
  const wins=[];
  for(const part of hoursStr.split(',')){
    const m=part.trim().match(/^([A-Za-z,\- ]+?)\s+(\d[^ ]*(?:-\d[^ ]*)?(?:\s*[ap]m)?)(?:\s*&?\s*(\d[^ ]*(?:-\d[^ ]*)?\s*[ap]m)?)?$/i);
    if(!m)continue;
    const days=m[1].trim(),daySet=new Set();
    if(/daily/i.test(days)){DAYS.forEach(d=>daySet.add(d));}
    else{for(const range of days.split(/\s+(?=[A-Z])/)){const r=range.match(/^([A-Z][a-z]{2})(?:-([A-Z][a-z]{2}))?$/);if(!r)continue;const a=DAYS.indexOf(r[1]),b=r[2]?DAYS.indexOf(r[2]):a;let i=a;for(;;){daySet.add(DAYS[i]);if(i===b)break;i=(i+1)%7;if(i===a)break;}}}
    const times=[m[2],m[3]].filter(Boolean).map(r=>{const mm=r.match(/^(\d{1,2}(?::\d{2})?)(?:\s*(am|pm))?\s*-\s*(?:(\d{1,2}(?::\d{2})?)\s*(am|pm)|(close))$/i);if(!mm)return null;const es=mm[4]||mm[5];const end=es==='close'?1439:toMin(mm[3]+' '+es);const ss=mm[2]||(es==='pm'?'pm':(+mm[1].split(':')[0]<12?'pm':'am'));return[toMin(mm[1]+' '+ss),end];}).filter(Boolean);
    for(const [,e] of times)wins.push({days:daySet,s:e});
  }
  return wins;
}
function status(v){
  const wins=windowsOf(v.hours);
  if(!wins.length)return{key:'done',label:'No HH listed'};
  const h=NOW.getHours()*60+NOW.getMinutes();
  let best=null;
  for(const w of wins){
    if(!w.days.has(DAY))continue;
    if(h>=w.s&&h<=w.e)return{key:'live',label:'LIVE now'};
    const until=w.s-h;
    if(until>0&&(best===null||until<best))best=until;
  }
  if(best!==null)return{key:'soon',label:best<=120?`Opens in ${best}m`:`Opens in ${Math.round(best/60)}h`};
  return{key:'done',label:'Closed today'};
}
function priceLabel(sp){
  if(sp.p>0)return'$'+sp.p.toFixed(2).replace(/\.00$/,'');
  if(/off|discount|half|bogo|special|price|deal|2 for 1|2-4-1|one free|\$|cents|%/i.test(sp.d||''))return'—';
  return'FREE';
}
const minutesFromNow=start=>start-(NOW.getHours()*60+NOW.getMinutes());
function bellFor(v){
  const wins=windowsOf(v.hours).filter(w=>w.days.has(DAY));
  if(!wins.length)return'';
  const d=Math.min(...wins.map(w=>w.s-(NOW.getHours()*60+NOW.getMinutes())));
  return(d>0&&d<=15)?'<span class="bell" title="starts soon">🔔</span>':'';
}

// map
const selected=new Set();
const pinGroup=document.getElementById('pins');
function cowPin(v,i){
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','pin-cow');
  g.setAttribute('transform',`translate(${v.x},${v.y})`);
  g.innerHTML=`<ellipse class="cow-body" cx="0" cy="-6" rx="11" ry="8" fill="#fdf6ec" stroke="#c48450" stroke-width="2"/>
    <ellipse cx="-6" cy="-10" rx="4.5" ry="3.5" fill="#fdf6ec" stroke="#c48450" stroke-width="1.5"/>
    <ellipse cx="6" cy="-10" rx="4.5" ry="3.5" fill="#fdf6ec" stroke="#c48450" stroke-width="1.5"/>
    <circle cx="-4.5" cy="-17" r="2.2" fill="#c48450"/><circle cx="-4.5" cy="-13" r="1.2" fill="#c48450"/>
    <circle cx="4.5" cy="-17" r="2.2" fill="#c48450"/><circle cx="4.5" cy="-13" r="1.2" fill="#c48450"/>
    <circle cx="0" cy="-6" r="1.6" fill="#8b5e3c"/>
    <circle cx="3" cy="-6" r="1.6" fill="#8b5e3c"/>
    <text class="pin-label" x="0" y="6" text-anchor="middle">${v.name.split(' ')[0]}</text>`;
  g.onclick=()=>{
    if(selected.has(v.id))selected.delete(v.id);else selected.add(v.id);
    drawPins();
  };
  return g;
}
function drawPins(){
  pinGroup.innerHTML='';
  VENUES.forEach((v,i)=>pinGroup.appendChild(cowPin(v,i)));
  // selection rings + path
  const sel=[...selected].map(id=>VENUES.find(v=>v.id===id));
  if(sel.length>=2){
    const pts=sel.map(v=>({x:v.x,y:v.y-6}));
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','path-line');
    p.setAttribute('d','M'+pts.map(pt=>`${pt.x},${pt.y}`).join(' L'));
    pinGroup.appendChild(p);
    pts.forEach((pt,i)=>{
      const n=document.createElementNS('http://www.w3.org/2000/svg','g');
      n.setAttribute('transform',`translate(${pt.x},${pt.y})`);
      n.innerHTML=`<circle r="8"/><text class="path-num" x="0" y="0">${i+1}</text>`;
      pinGroup.appendChild(n);
    });
  }
  document.getElementById('crawl').classList.toggle('show',sel.length>=2);
  const hops=sel.map(v=>v.name.split(' ')[0]);
  document.getElementById('crawlHops').textContent=sel.length?'🐾 '+hops.join(' → '):'';
  const totalMoos=sel.reduce((a,v)=>a+v.moos,0);
  document.getElementById('crawlStats').textContent=sel.length?`${totalMoos} moos · ~${Math.round(totalMoos*3)} min walk`:'';
}
document.getElementById('crawlClear').onclick=()=>{selected.clear();drawPins();toast('🧹 Path cleared');};

// list
function renderList(){
  document.getElementById('list').innerHTML=VENUES.map(v=>{
    const st=status(v);
    const sp=v.specials.map(s=>`<div class="special"><span class="item">${s.i}</span><span class="price">${priceLabel(s)}</span></div>`).join('');
    const pin=selected.has(v.id)?' 📍':'';
    return `<div class="venue ${st.key}"><div class="vtop"><span class="vname">${bellFor(v)}${v.name}${pin}</span><span class="vstatus">${st.label}</span></div>
    <div class="vmeta">🕒 ${v.hours} · 🐮 ${v.moos} moo${v.moos>1?'s':''} away</div>${sp}</div>`;
  }).join('');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};

drawPins();renderList();
</script>
</body>
</html>
