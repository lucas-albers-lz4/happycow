<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — The Herd</title>
<style>
  :root{--bg:#fdf6ec;--card:#fff;--text:#2c1810;--dim:#8b7355;--gold:#d4a04a;--spot:#c48450;--green:#5a9c69;--radius:16px;--shadow:0 2px 12px rgba(0,0,0,.08)}
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--shadow:0 2px 12px rgba(0,0,0,.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.2rem}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:var(--shadow)}
  .hero{background:linear-gradient(135deg,var(--spot),var(--gold));color:#fff;border-radius:var(--radius);padding:16px;margin:8px 0 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero::after{content:"🐮";position:absolute;right:-6px;bottom:-16px;font-size:72px;opacity:.2;transform:rotate(12deg)}
  .hero .k{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .hero h2{font-size:1.15rem;margin:4px 0 6px}
  .hero p{font-size:.82rem;opacity:.95;max-width:36ch}
  .friends{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .friend{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:.55;transition:.15s}
  .friend.on{opacity:1;transform:scale(1.05)}
  .friend .av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.3rem;border:2px solid transparent}
  .friend.on .av{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .friend small{font-size:.62rem;font-weight:700}
  .hint{font-size:.78rem;color:var(--dim);font-weight:700;margin:0 0 10px}
  .venue{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;cursor:pointer;border:2px solid transparent;transition:.15s}
  .venue:hover{border-color:rgba(196,132,80,.35)}
  .venue.picked{border-color:var(--spot);background:linear-gradient(90deg,rgba(196,132,80,.08),transparent)}
  .venue.winner{border-color:var(--green);box-shadow:0 0 0 3px rgba(90,156,105,.25)}
  .vname{font-weight:800}.vmeta{font-size:.72rem;color:var(--dim);font-weight:600}
  .vote{display:flex;align-items:center;gap:6px}
  .bar{width:64px;height:8px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden}
  body.dark .bar{background:rgba(255,255,255,.1)}
  .bar i{display:block;height:100%;background:var(--spot);border-radius:999px;width:0;transition:width .3s}
  .pct{font-size:.72rem;font-weight:800;color:var(--spot);min-width:2.2ch;text-align:right}
  .crown{font-size:.85rem}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--spot);color:#fff;padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:700;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none}
  .toast.show{opacity:1}
  .reset{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:2px dashed var(--gold);background:transparent;font:inherit;font-weight:750;font-size:.85rem;cursor:pointer;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐄 Happy <span>Cow</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>

  <div class="hero">
    <div class="k">Group night · The Herd</div>
    <h2>Whose cow wins?</h2>
    <p>Pick a friend, then tap venues to cast their vote. Tallies update live — majority rules.</p>
    <div class="friends" id="friends"></div>
  </div>

  <div class="hint" id="hint">Voting as Daisy — tap a spot below</div>
  <div id="list"></div>
  <button class="reset" id="resetBtn">♻️ Reset the herd vote</button>
</div>
<div class="toast" id="toast"></div>

<script>
const NOW=new Date('2026-08-05T17:12:00');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=DAYS[NOW.getDay()];
const VENUES=[
  {id:'bar-ix',name:'Bar IX',tags:['dive'],hours:'Daily 2-7pm',specials:[{i:'2-for-1 wells',p:0}]},
  {id:'club-tavern',name:'The Club Tavern',tags:['pub','sports'],hours:'Mon-Fri 4-7pm',specials:[{i:'$1 drafts',p:1}]},
  {id:'rocking-r',name:'Rocking R Bar',tags:['dive','western'],hours:'Mon-Fri 4-7pm',specials:[{i:'50¢ wings',p:0}]},
  {id:'brigade',name:'Brigade',tags:['downtown'],hours:'Daily 3-6pm',specials:[{i:'Martinis',p:3}]},
  {id:'blackbird',name:'Blackbird',tags:['classy'],hours:'Daily 4:30-5:30pm',specials:[{i:'Half-price wine',p:0}]},
  {id:'shine',name:'Shine',tags:['craft-beer'],hours:'Daily 3-5pm',specials:[{i:'2-for-1 flights',p:0}]},
  {id:'bacchus',name:'Bacchus Pub',tags:['pub'],hours:'Daily 2-6pm',specials:[{i:'Well drinks',p:3.5}]},
  {id:'copper',name:'Copper Whiskey',tags:['whiskey'],hours:'Mon-Fri 3-5pm',specials:[{i:'$5 off flights',p:0}]},
];
const FRIENDS=[
  {id:'daisy',name:'Daisy',face:'🐮'},
  {id:'bessie',name:'Bessie',face:'🐄'},
  {id:'clover',name:'Clover',face:'🐣'},
  {id:'angus',name:'Angus',face:'🐂'},
];

function toMin(s){const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3].toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mi;}
function windowsOf(hoursStr){
  const wins=[];
  for(const part of hoursStr.split(',')){
    const m=part.trim().match(/^([A-Za-z,\- ]+?)\s+(\d[^ ]*(?:-\d[^ ]*)?(?:\s*[ap]m)?)/i);if(!m)continue;
    const daySet=new Set();
    if(/daily/i.test(m[1]))DAYS.forEach(d=>daySet.add(d));
    else{for(const range of m[1].trim().split(/\s+(?=[A-Z])/)){const r=range.match(/^([A-Z][a-z]{2})(?:-([A-Z][a-z]{2}))?$/);if(!r)continue;const a=DAYS.indexOf(r[1]),b=r[2]?DAYS.indexOf(r[2]):a;let i=a;for(;;){daySet.add(DAYS[i]);if(i===b)break;i=(i+1)%7;if(i===a)break;}}}
    const mm=m[2].match(/^(\d{1,2}(?::\d{2})?)(?:\s*(am|pm))?\s*-\s*(\d{1,2}(?::\d{2})?)\s*(am|pm)/i);
    if(mm){const ss=mm[2]||mm[4];wins.push({days:daySet,s:toMin(mm[1]+' '+ss),e:toMin(mm[3]+' '+mm[4])});}
  }
  return wins;
}
function status(v){
  const h=NOW.getHours()*60+NOW.getMinutes();
  for(const w of windowsOf(v.hours)){if(w.days.has(DAY)&&h>=w.s&&h<=w.e)return{key:'live',label:'LIVE'};}
  return{key:'soon',label:v.hours};
}

let active=FRIENDS[0].id;
const votes={}; // friendId -> venueId

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function tallies(){
  const t={};VENUES.forEach(v=>t[v.id]=0);
  Object.values(votes).forEach(vid=>{if(t[vid]!=null)t[vid]++;});
  return t;
}

function renderFriends(){
  document.getElementById('friends').innerHTML=FRIENDS.map(f=>`
    <div class="friend ${f.id===active?'on':''}" data-id="${f.id}">
      <div class="av">${f.face}</div><small>${f.name}${votes[f.id]?' ✓':''}</small>
    </div>`).join('');
  document.querySelectorAll('.friend').forEach(el=>el.onclick=()=>{active=el.dataset.id;render();});
}

function render(){
  renderFriends();
  const f=FRIENDS.find(x=>x.id===active);
  document.getElementById('hint').textContent=`Voting as ${f.name} — tap a spot below (${Object.keys(votes).length}/${FRIENDS.length} voted)`;
  const t=tallies();
  const total=Object.keys(votes).length||1;
  const max=Math.max(0,...Object.values(t));
  const winnerId=max>0&&Object.keys(votes).length>=2?Object.entries(t).sort((a,b)=>b[1]-a[1])[0][0]:null;

  document.getElementById('list').innerHTML=VENUES.map(v=>{
    const st=status(v);
    const n=t[v.id], pct=Math.round((n/FRIENDS.length)*100);
    const mine=votes[active]===v.id;
    return `<div class="venue ${mine?'picked':''} ${v.id===winnerId?'winner':''}" data-id="${v.id}">
      <div>
        <div class="vname">${v.id===winnerId?'👑 ':''}${v.name}</div>
        <div class="vmeta">${st.label} · ${v.tags.join(' · ')} · ${v.specials[0].i}</div>
      </div>
      <div class="vote"><div class="bar"><i style="width:${(n/FRIENDS.length)*100}%"></i></div><span class="pct">${n}</span></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.venue').forEach(el=>el.onclick=()=>{
    votes[active]=el.dataset.id;
    const name=VENUES.find(v=>v.id===el.dataset.id).name;
    toast(`${f.face} ${f.name} picks ${name}`);
    const next=FRIENDS.find(x=>!votes[x.id]);
    if(next)active=next.id;
    render();
    if(Object.keys(votes).length===FRIENDS.length){
      const win=VENUES.find(v=>v.id===Object.entries(tallies()).sort((a,b)=>b[1]-a[1])[0][0]);
      setTimeout(()=>toast(`🎉 Herd consensus: ${win.name}`),400);
    }
  });
}

document.getElementById('resetBtn').onclick=()=>{for(const k of Object.keys(votes))delete votes[k];active=FRIENDS[0].id;toast('Herd reset');render();};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};
render();
</script>
</body>
</html>
