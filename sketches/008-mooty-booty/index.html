<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — Moo-ty Booty</title>
<style>
  :root{--bg:#fdf6ec;--card:#fff;--text:#2c1810;--dim:#8b7355;--gold:#d4a04a;--spot:#c48450;--green:#5a9c69;--radius:16px;--shadow:0 2px 12px rgba(0,0,0,.08)}
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--shadow:0 2px 12px rgba(0,0,0,.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.2rem}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:var(--shadow)}
  .kicker{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--spot);margin:8px 0 4px}
  h1{font-size:1.35rem;margin-bottom:4px}
  .sub{font-size:.82rem;color:var(--dim);font-weight:600;margin-bottom:18px}
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin:10px 0 20px}
  .wheel-wrap{position:relative;width:min(300px,86vw);aspect-ratio:1}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;font-size:1.4rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  canvas{width:100%;height:100%;border-radius:50%;box-shadow:var(--shadow),0 0 0 6px var(--card),0 0 0 8px var(--gold)}
  .spin{background:linear-gradient(135deg,var(--spot),var(--gold));color:#fff;border:none;border-radius:999px;padding:14px 28px;font:inherit;font-size:1rem;font-weight:850;cursor:pointer;box-shadow:var(--shadow);min-width:180px}
  .spin:disabled{opacity:.6;cursor:wait}
  .result{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);width:100%;text-align:center;min-height:96px;display:grid;place-items:center}
  .result .empty{color:var(--dim);font-weight:700;font-size:.85rem}
  .result .win{font-size:1.15rem;font-weight:850}
  .result .meta{font-size:.8rem;color:var(--dim);font-weight:600;margin-top:4px}
  .result .deal{margin-top:8px;font-weight:800;color:var(--spot)}
  .pool{font-size:.75rem;color:var(--dim);font-weight:650;text-align:center}
  @keyframes jiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .bell{display:inline-block;animation:jiggle .4s ease 3}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐄 Happy <span>Cow</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>

  <div class="kicker">Indecision killer</div>
  <h1>🎰 Moo-ty Booty</h1>
  <div class="sub">Spin the wheel of live happy hours. Fate (and a little physics) picks your night.</div>

  <div class="stage">
    <div class="wheel-wrap">
      <div class="pointer">▼</div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <button class="spin" id="spinBtn">🔔 Spin the herd</button>
    <div class="pool" id="pool"></div>
  </div>

  <div class="result" id="result"><div class="empty">Give it a spin — live venues only</div></div>
</div>

<script>
const NOW=new Date('2026-08-05T17:12:00');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=DAYS[NOW.getDay()];
const ALL=[
  {id:'ale-works',name:'Ale Works',hours:'Daily 4-6pm',deal:'$1 off drafts'},
  {id:'bar-ix',name:'Bar IX',hours:'Daily 2-7pm',deal:'2-for-1 wells'},
  {id:'brigade',name:'Brigade',hours:'Daily 3-6pm',deal:'$3 martinis'},
  {id:'bourbon',name:'Bourbon',hours:'Daily 4-6pm',deal:'Whiskey specials'},
  {id:'devils',name:'Devils Toboggan',hours:'Daily 4-6pm',deal:'Beers $3'},
  {id:'la-brasserie',name:'La Brasserie',hours:'Daily 4-6pm',deal:'Wine by glass'},
  {id:'club-tavern',name:'Club Tavern',hours:'Mon-Fri 4-7pm',deal:'$1 drafts'},
  {id:'rocking-r',name:'Rocking R',hours:'Mon-Fri 4-7pm',deal:'50¢ wings'},
  {id:'urban-kitchen',name:'Urban Kitchen',hours:'Daily 3-6pm',deal:'½ off plates'},
  {id:'bacchus',name:'Bacchus Pub',hours:'Daily 2-6pm',deal:'Wells $3.50'},
  {id:'finks',name:'Finks Deli',hours:'Daily 2-4pm',deal:'Half off sandwiches'},
  {id:'revelry',name:'Revelry',hours:'Daily 2:30-4pm',deal:'Rainier tallboys'},
];
const COLORS=['#c48450','#d4a04a','#5a9c69','#8b5a3c','#d46a6a','#6a8caf','#9c7a5a','#b08d57','#4a7c59','#c44a4a'];

function toMin(s){const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3].toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mi;}
function isLive(hours){
  const m=hours.match(/^([A-Za-z,\- ]+?)\s+(\d{1,2}(?::\d{2})?)(?:\s*(am|pm))?\s*-\s*(\d{1,2}(?::\d{2})?)\s*(am|pm)/i);if(!m)return false;
  const daySet=new Set();
  if(/daily/i.test(m[1]))DAYS.forEach(d=>daySet.add(d));
  else{for(const range of m[1].trim().split(/\s+(?=[A-Z])/)){const r=range.match(/^([A-Z][a-z]{2})(?:-([A-Z][a-z]{2}))?$/);if(!r)continue;const a=DAYS.indexOf(r[1]),b=r[2]?DAYS.indexOf(r[2]):a;let i=a;for(;;){daySet.add(DAYS[i]);if(i===b)break;i=(i+1)%7;if(i===a)break;}}}
  if(!daySet.has(DAY))return false;
  const ss=m[3]||m[5];const s=toMin(m[2]+' '+ss),e=toMin(m[4]+' '+m[5]);
  const h=NOW.getHours()*60+NOW.getMinutes();
  return h>=s&&h<=e;
}

const VENUES=ALL.filter(v=>isLive(v.hours));
document.getElementById('pool').textContent=`${VENUES.length} live venues on the wheel · demo clock Wed 5:12pm`;

const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
let angle=0, spinning=false;

function draw(){
  const cx=300,cy=300,r=290,n=VENUES.length,slice=Math.PI*2/n;
  ctx.clearRect(0,0,600,600);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.fillStyle=COLORS[i%COLORS.length];
    ctx.arc(0,0,r,i*slice,(i+1)*slice);ctx.fill();
    ctx.save();ctx.rotate(i*slice+slice/2);ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font='bold 22px -apple-system,sans-serif';
    ctx.fillText(VENUES[i].name.slice(0,14), r-24, 8);
    ctx.restore();
  }
  ctx.beginPath();ctx.fillStyle='#2c1810';ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d4a04a';ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐄',0,2);
  ctx.restore();
}

function winnerIndex(){
  const n=VENUES.length,slice=Math.PI*2/n;
  // pointer at top (-π/2 in standard); normalize
  const a=((Math.PI*1.5-angle)%(Math.PI*2)+(Math.PI*2))%(Math.PI*2);
  return Math.floor(a/slice)%n;
}

function spin(){
  if(spinning||!VENUES.length)return;
  spinning=true;document.getElementById('spinBtn').disabled=true;
  const target=Math.floor(Math.random()*VENUES.length);
  const slice=Math.PI*2/VENUES.length;
  const extra=Math.PI*2*(5+Math.random()*3);
  const final=extra + (Math.PI*1.5 - (target*slice+slice/2));
  const start=angle, t0=performance.now(), dur=3200;
  function frame(t){
    const p=Math.min(1,(t-t0)/dur);
    const ease=1-Math.pow(1-p,3);
    angle=start+(final-start)*ease;
    draw();
    if(p<1)requestAnimationFrame(frame);
    else{
      spinning=false;document.getElementById('spinBtn').disabled=false;
      const w=VENUES[winnerIndex()];
      document.getElementById('result').innerHTML=`
        <div><div class="win"><span class="bell">🔔</span> ${w.name}</div>
        <div class="meta">${w.hours} · LIVE now</div>
        <div class="deal">${w.deal}</div></div>`;
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById('spinBtn').onclick=spin;
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};
draw();
</script>
</body>
</html>
