<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — Game → Deals</title>
<style>
  :root{--bg:#fdf6ec;--card:#fff;--text:#2c1810;--dim:#8b7355;--gold:#d4a04a;--spot:#c48450;--green:#5a9c69;--radius:16px;--shadow:0 2px 12px rgba(0,0,0,.08)}
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--shadow:0 2px 12px rgba(0,0,0,.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.2rem}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:var(--shadow)}
  .quiz{background:var(--card);border-radius:var(--radius);padding:16px;margin:8px 0 14px;box-shadow:var(--shadow)}
  .quiz .k{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--spot)}
  .quiz h2{font-size:1.1rem;margin:4px 0 10px}
  .q{font-weight:750;font-size:.9rem;margin-bottom:10px}
  .opts{display:grid;gap:8px}
  .opt{text-align:left;padding:11px 12px;border-radius:12px;border:1.5px solid rgba(0,0,0,.1);background:var(--bg);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
  body.dark .opt{border-color:rgba(255,255,255,.12)}
  .opt:hover,.opt.on{border-color:var(--spot);background:rgba(196,132,80,.1)}
  .result{display:none;margin-top:12px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--spot),var(--gold));color:#fff}
  .result.show{display:block}
  .result .face{font-size:2rem}
  .result h3{font-size:1.05rem;margin:4px 0}
  .result p{font-size:.8rem;opacity:.95}
  .banner{display:none;align-items:center;gap:10px;background:var(--card);border:2px solid var(--spot);border-radius:999px;padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow);font-size:.8rem;font-weight:750}
  .banner.show{display:flex}
  .banner button{margin-left:auto;border:none;background:transparent;font:inherit;font-weight:800;color:var(--spot);cursor:pointer}
  .hint{font-size:.78rem;color:var(--dim);font-weight:700;margin-bottom:10px}
  .venue{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
  .venue.soon{border-left-color:var(--gold)}
  .venue.done{border-left-color:#bbb;opacity:.7}
  .vtop{display:flex;align-items:baseline;gap:8px}
  .vname{font-weight:800}.vtags{font-size:.68rem;color:var(--dim);font-weight:600}
  .vstatus{margin-left:auto;font-size:.66rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--green);color:#fff}
  .soon .vstatus{background:var(--gold)}.done .vstatus{background:#ccc;color:#555}
  .vhours{font-size:.75rem;color:var(--dim);font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐄 Happy <span>Cow</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>

  <div class="quiz" id="quiz">
    <div class="k">What Cow Are You · day-seeded</div>
    <h2>Games that pay off in deals</h2>
    <div class="q" id="q">Tonight you're craving…</div>
    <div class="opts" id="opts"></div>
    <div class="result" id="result"></div>
  </div>

  <div class="banner" id="banner">
    <span id="bannerText"></span>
    <button id="clearBtn">Clear</button>
  </div>
  <div class="hint" id="hint">All venues — take the quiz to apply today's cow vibe</div>
  <div id="list"></div>
</div>

<script>
const NOW=new Date('2026-08-05T17:12:00');
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY=DAYS[NOW.getDay()];
const VENUES=[
  {id:'bar-ix',name:'Bar IX',tags:['dive'],hours:'Daily 2-7pm'},
  {id:'rocking-r',name:'Rocking R',tags:['dive','western'],hours:'Mon-Fri 4-7pm'},
  {id:'club-tavern',name:'Club Tavern',tags:['pub','sports'],hours:'Mon-Fri 4-7pm'},
  {id:'bww',name:'Buffalo Wild Wings',tags:['sports'],hours:'Mon-Fri 3-6pm'},
  {id:'blackbird',name:'Blackbird',tags:['classy','downtown'],hours:'Daily 4:30-5:30pm'},
  {id:'urban-kitchen',name:'Urban Kitchen',tags:['classy'],hours:'Daily 3-6pm'},
  {id:'la-brasserie',name:'La Brasserie',tags:['classy'],hours:'Daily 4-6pm'},
  {id:'shine',name:'Shine',tags:['craft-beer'],hours:'Daily 3-5pm'},
  {id:'copper',name:'Copper Whiskey',tags:['whiskey'],hours:'Mon-Fri 3-5pm'},
  {id:'bourbon',name:'Bourbon',tags:['whiskey','downtown'],hours:'Daily 4-6pm'},
  {id:'ale-works',name:'Ale Works',tags:['downtown','craft-beer'],hours:'Daily 4-6pm'},
  {id:'bacchus',name:'Bacchus Pub',tags:['pub'],hours:'Daily 2-6pm'},
  {id:'brigade',name:'Brigade',tags:['downtown'],hours:'Daily 3-6pm'},
  {id:'revelry',name:'Revelry',tags:['downtown'],hours:'Daily 2:30-4pm'},
];

const COWS=[
  {id:'rowdy',face:'🤪',name:'Rowdy Cow',blurb:'You want noise, wings, and a crowd that cheers at TVs.',tags:['dive','sports','western']},
  {id:'fancy',face:'🥂',name:'Fancy Cow',blurb:'Corner booth, soft lighting, something in a stem glass.',tags:['classy','downtown']},
  {id:'chill',face:'😌',name:'Chill Cow',blurb:'Local pints, whiskey flights, nowhere to be.',tags:['craft-beer','whiskey']},
  {id:'thrifty',face:'🤑',name:'Thrifty Cow',blurb:'Maximum mooch. Minimum spend.',tags:['dive','pub']},
];

// day-seeded default cow (same for whole herd that day)
const dayCow=COWS[NOW.getDate()%COWS.length];

function toMin(s){const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3].toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+mi;}
function windowsOf(hoursStr){
  const wins=[];
  for(const part of hoursStr.split(',')){
    const m=part.trim().match(/^([A-Za-z,\- ]+?)\s+(\d[^ ]*(?:-\d[^ ]*)?(?:\s*[ap]m)?)/i);if(!m)continue;
    const daySet=new Set();
    if(/daily/i.test(m[1]))DAYS.forEach(d=>daySet.add(d));
    else{for(const range of m[1].trim().split(/\s+(?=[A-Z])/)){const r=range.match(/^([A-Z][a-z]{2})(?:-([A-Z][a-z]{2}))?$/);if(!r)continue;const a=DAYS.indexOf(r[1]),b=r[2]?DAYS.indexOf(r[2]):a;let i=a;for(;;){daySet.add(DAYS[i]);if(i===b)break;i=(i+1)%7;if(i===a)break;}}}
    const mm=m[2].match(/^(\d{1,2}(?::\d{2})?)(?:\s*(am|pm))?\s*-\s*(\d{1,2}(?::\d{2})?)\s*(am|pm)/i);
    if(mm){const ss=mm[2]||mm[4];wins.push({days:daySet,s:toMin(mm[1]+' '+ss),e:toMin(mm[3]+' '+mm[4])});}
  }
  return wins;
}
function status(v){
  const h=NOW.getHours()*60+NOW.getMinutes();
  for(const w of windowsOf(v.hours)){
    if(!w.days.has(DAY))continue;
    if(h>=w.s&&h<=w.e)return{key:'live',label:'LIVE'};
    if(h<w.s)return{key:'soon',label:`in ${w.s-h}m`};
  }
  return{key:'done',label:'closed'};
}

let filterTags=null, activeCow=null;

const QUESTIONS=[
  {q:'Tonight you\'re craving…', opts:[
    {t:'A loud room and cheap pitchers', cow:'rowdy'},
    {t:'Something you can sip slowly', cow:'fancy'},
    {t:'A quiet corner with local beer', cow:'chill'},
    {t:'Whatever costs the least', cow:'thrifty'},
  ]},
];

function showQuiz(){
  const Q=QUESTIONS[0];
  document.getElementById('q').textContent=Q.q;
  document.getElementById('opts').innerHTML=Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join('');
  document.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');
    const cow=COWS.find(c=>c.id===Q.opts[+btn.dataset.i].cow);
    applyCow(cow,true);
  });
}

function applyCow(cow,fromQuiz){
  activeCow=cow;filterTags=new Set(cow.tags);
  const res=document.getElementById('result');
  res.className='result show';
  res.innerHTML=`<div class="face">${cow.face}</div><h3>You're a ${cow.name}</h3><p>${cow.blurb}</p><p style="margin-top:6px;font-weight:800">Applying vibe → ${cow.tags.join(', ')}</p>`;
  document.getElementById('banner').className='banner show';
  document.getElementById('bannerText').textContent=`${cow.face} ${cow.name} filter on · today's herd cow was ${dayCow.face} ${dayCow.name}`;
  render();
}

function render(){
  let list=[...VENUES];
  if(filterTags)list=list.filter(v=>v.tags.some(t=>filterTags.has(t)));
  document.getElementById('hint').textContent=filterTags
    ? `${list.length} spots match ${activeCow.name}`
    : `All venues — today's herd cow is ${dayCow.face} ${dayCow.name} (tap to apply without quiz)`;
  document.getElementById('list').innerHTML=list.map(v=>{
    const st=status(v);
    return `<div class="venue ${st.key}">
      <div class="vtop"><span class="vname">${v.name}</span><span class="vtags">${v.tags.join(' · ')}</span><span class="vstatus">${st.label}</span></div>
      <div class="vhours">🕒 ${v.hours}</div>
    </div>`;
  }).join('');
}

document.getElementById('clearBtn').onclick=()=>{
  filterTags=null;activeCow=null;
  document.getElementById('banner').className='banner';
  document.getElementById('result').className='result';
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  render();
};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};

// quick apply day cow from hint click
document.getElementById('hint').style.cursor='pointer';
document.getElementById('hint').onclick=()=>{if(!filterTags)applyCow(dayCow,false);};

showQuiz();
render();
</script>
</body>
</html>
