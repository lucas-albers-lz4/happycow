<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Cow — Mooch List</title>
<style>
  :root{--bg:#fdf6ec;--card:#fff;--text:#2c1810;--dim:#8b7355;--gold:#d4a04a;--spot:#c48450;--green:#5a9c69;--radius:16px;--shadow:0 2px 12px rgba(0,0,0,.08)}
  body.dark{--bg:#120e0a;--card:#1e1814;--text:#e8ddd0;--dim:#8b7a6a;--shadow:0 2px 12px rgba(0,0,0,.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.2rem}.logo span{color:var(--gold)}
  .spacer{flex:1}
  .icon-btn{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:var(--shadow)}
  .kicker{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--spot);margin:8px 0 4px}
  h1{font-size:1.35rem;letter-spacing:-.02em;margin-bottom:4px}
  .sub{font-size:.82rem;color:var(--dim);font-weight:600;margin-bottom:16px}
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:18px}
  .pod{background:var(--card);border-radius:var(--radius) var(--radius) 8px 8px;padding:12px 8px 10px;text-align:center;box-shadow:var(--shadow);position:relative}
  .pod.gold{background:linear-gradient(180deg,#f5d78e,var(--gold));color:#3a2410;min-height:150px}
  .pod.silver{min-height:120px;background:linear-gradient(180deg,#eee,#c8c8c8);color:#2a2a2a}
  .pod.bronze{min-height:100px;background:linear-gradient(180deg,#e8c4a0,#c48450);color:#2c1810}
  .pod .place{font-size:1.4rem;margin-bottom:4px}
  .pod .name{font-weight:850;font-size:.85rem}
  .pod .bells{font-size:.9rem;letter-spacing:-1px;margin:4px 0}
  .pod .val{font-size:.68rem;font-weight:750;opacity:.85}
  .row{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
  .rank{font-weight:850;color:var(--dim);font-size:.9rem}
  .vname{font-weight:800;font-size:.92rem}
  .vmeta{font-size:.7rem;color:var(--dim);font-weight:600}
  .score{text-align:right}
  .bells2{font-size:.85rem;letter-spacing:-1px}
  .price{font-size:.78rem;font-weight:850;color:var(--spot)}
  .note{font-size:.72rem;color:var(--dim);margin-top:12px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🐄 Happy <span>Cow</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>

  <div class="kicker">Value leaderboard</div>
  <h1>🔔 Mooch List</h1>
  <div class="sub">Bang-for-buck ranking — cowbells from the herd. Cheapest strong deals rise to the podium.</div>

  <div class="podium" id="podium"></div>
  <div id="list"></div>
  <p class="note">Score = cowbells ÷ max(drink price, $1). Sketch uses curated prices; production would need cleaner price data.</p>
</div>

<script>
const ROWS=[
  {name:'The Club Tavern',tag:'pub',drink:1,bells:4,deal:'$1 drafts'},
  {name:'Revelry',tag:'downtown',drink:2,bells:5,deal:'Rainier tallboys'},
  {name:'Old Chicago',tag:'pub',drink:2.5,bells:4,deal:'Domestic + ½ apps'},
  {name:'Bar IX',tag:'dive',drink:0,bells:5,deal:'2-for-1 everything',eff:1.5},
  {name:'Brigade',tag:'downtown',drink:3,bells:4,deal:'$3 martinis'},
  {name:'Rocking R',tag:'western',drink:4,bells:5,deal:'Drafts + 50¢ wings'},
  {name:'Shine',tag:'craft-beer',drink:4,bells:4,deal:'2-for-1 flights'},
  {name:'Bacchus Pub',tag:'pub',drink:3.5,bells:3,deal:'Wells $3.50'},
  {name:'Pour House',tag:'downtown',drink:3.75,bells:3,deal:'Micro drafts'},
  {name:'Copper Whiskey',tag:'whiskey',drink:5,bells:4,deal:'$5 off flights'},
  {name:'Buffalo Wild Wings',tag:'sports',drink:6,bells:3,deal:'BOGO wings'},
  {name:'La Brasserie',tag:'classy',drink:6,bells:3,deal:'Wine by glass'},
].map(r=>({...r,price:r.eff||Math.max(r.drink,1),score:(r.bells/Math.max(r.eff||r.drink||1,1))})).sort((a,b)=>b.score-a.score);

function bells(n){return '🔔'.repeat(n)+'🔕'.repeat(Math.max(0,5-n));}

function render(){
  const [a,b,c]=ROWS;
  // podium visual order: 2nd, 1st, 3rd
  const pods=[
    {r:b,cls:'silver',place:'🥈'},
    {r:a,cls:'gold',place:'🥇'},
    {r:c,cls:'bronze',place:'🥉'},
  ];
  document.getElementById('podium').innerHTML=pods.map(p=>`
    <div class="pod ${p.cls}">
      <div class="place">${p.place}</div>
      <div class="name">${p.r.name}</div>
      <div class="bells">${bells(p.r.bells)}</div>
      <div class="val">${p.r.deal}</div>
    </div>`).join('');

  document.getElementById('list').innerHTML=ROWS.slice(3).map((r,i)=>`
    <div class="row">
      <div class="rank">${i+4}</div>
      <div><div class="vname">${r.name}</div><div class="vmeta">${r.tag} · ${r.deal}</div></div>
      <div class="score"><div class="bells2">${bells(r.bells)}</div><div class="price">${r.drink?('$'+r.drink):'deal'}</div></div>
    </div>`).join('');
}

document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';};
render();
</script>
</body>
</html>
