name: Scrape happy hours

on:
  schedule:
    # Sun + Thu 14:00 UTC ≈ 8am Mountain
    - cron: "0 14 * * 0,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-happy-hours
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape venues
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python scripts/scrape_happy_hours.py

      - name: Commit updated data
        run: |
          git config user.name "happycow-bot"
          git config user.email "happycow-bot@users.noreply.github.com"
          git add data/happy_hour_data.json data/scrape_cache.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh Bozeman happy hours"
            git push
          fi
