name: Scrape happy hours

on:
  schedule:
    # Sun + Thu 14:00 UTC ≈ 8am Mountain
    - cron: "0 14 * * 0,4"
  workflow_dispatch:
    inputs:
      skip_discovery:
        description: "Skip venue discovery (fast re-scrape of existing venues)"
        type: boolean
        default: false
      pr_mode:
        description: "Open a PR instead of committing when changes exceed threshold or regressions detected (default: true)"
        type: boolean
        default: true
      force_commit:
        description: "Force commit to main even if PR mode would trigger (overrides pr_mode)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape-happy-hours
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          # Chromium for own-site WAF / JS-shell fallback (scraper.fetch)
          playwright install --with-deps chromium

      - name: Discover new venues
        if: inputs.skip_discovery != 'true'
        timeout-minutes: 12
        run: |
          # Discovery is best-effort (a failed discovery should not block the
          # scrape of existing venues), but failures must be VISIBLE in logs.
          python scripts/discover_venues.py --write 2>&1 | tee /tmp/discovery.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "⚠️ discovery failed (continuing with existing venues) — see /tmp/discovery.log"
          fi

      - name: Scrape venues
        timeout-minutes: 20
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python scripts/scrape_happy_hours.py

      - name: Check for closed venues
        timeout-minutes: 8
        run: |
          # Report-only: flags venues whose sites died across 2+ runs or whose
          # mthappyhour entry says closed. Human reviews data/state/closure_report.md.
          python scripts/check_venue_status.py 2>&1 | tee /tmp/closure.log || true

      - name: Venue truth shadow pipeline
        timeout-minutes: 10
        run: |
          # observation → claim → decision (shadow). Uses eval fixture when
          # Overture cache empty; does not change published data unless
          # data/state/truth_config.json has suppress_enabled=true.
          python scripts/run_venue_truth.py 2>&1 | tee /tmp/truth.log
          python scripts/eval_venue_truth.py

      - name: Validate data
        timeout-minutes: 3
        # Phase 3 (issue #30): broken JSON / schema violations / unparseable
        # hours / config-data drift must fail the job BEFORE anything commits —
        # otherwise bad output ships straight to GitHub Pages.
        run: |
          python scripts/validate_data.py
          node scripts/validate_hours.mjs data/happy_hour_data.json

      - name: Data regression gate
        id: regression
        timeout-minutes: 2
        # Issue #40/#46: run regression check and capture exit code.
        # Exit 0 → happy path (auto-commit to main).
        # Exit 1 → hard-fail with PR mode off (job fails).
        # Exit 2 → PR mode: hard-fail OR large-delta (>5 venues changed);
        #           caller opens a scrape/YYYY-MM-DD branch + PR.
        # --pr-mode is active when the workflow_dispatch pr_mode input is true
        # (default: true) and force_commit is not set.
        # Baseline is always HEAD on main; unmerged scrape PRs are never used
        # as the baseline so they cannot poison the next run (issue #46).
        run: |
          USE_PR_MODE="true"
          if [ "${{ inputs.force_commit }}" = "true" ]; then
            USE_PR_MODE="false"
          elif [ "${{ inputs.pr_mode }}" = "false" ]; then
            USE_PR_MODE="false"
          fi

          set +e
          if [ "$USE_PR_MODE" = "true" ]; then
            python scripts/check_data_regression.py --pr-mode
          else
            python scripts/check_data_regression.py
          fi
          REGRESSION_RC=$?
          set -e

          echo "rc=$REGRESSION_RC" >> "$GITHUB_OUTPUT"
          echo "use_pr_mode=$USE_PR_MODE" >> "$GITHUB_OUTPUT"

          # In PR mode exit 2 is handled below; exit 1 is still a job failure.
          if [ "$REGRESSION_RC" = "1" ]; then
            exit 1
          fi

      - name: Commit updated data (happy path)
        if: steps.regression.outputs.rc == '0'
        timeout-minutes: 3
        run: |
          git config user.name "happycow-bot"
          git config user.email "happycow-bot@users.noreply.github.com"
          # Commit derived state + site data only — not full evidence payloads
          # (design decision 5: excerpts/hashes in state; evidence is local/CI artifact).
          git add data/happy_hour_data.json data/state/ config/venues.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh Bozeman happy hours + venue discovery"
            git push
          fi

      - name: Open scrape PR (large delta or regression in PR mode)
        if: steps.regression.outputs.rc == '2'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "happycow-bot"
          git config user.email "happycow-bot@users.noreply.github.com"

          BRANCH="scrape/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add data/happy_hour_data.json data/state/ config/venues.json
          if git diff --staged --quiet; then
            echo "No data changes — nothing to PR"
            exit 0
          fi
          git commit -m "chore: scrape data candidate $(date -u +%Y-%m-%d) (pending review)"
          git push -u origin "$BRANCH"

          REPORT=$(python scripts/check_data_regression.py --allow-regression 2>&1 || true)
          # Write PR body to a file — an inline heredoc at column 0 breaks the
          # YAML `run: |` scalar and GitHub rejects the whole workflow (0 jobs).
          {
            echo "## Automated scrape PR"
            echo
            echo "The scheduled scrape produced a large data delta or a regression-check failure."
            echo "This PR requires a human review before the data is committed to \`main\`."
            echo
            echo "**Baseline note:** this PR was opened because the change count exceeded the"
            echo "threshold (default 5 venues) or a hard-fail condition was detected."
            echo "The *next* scheduled run still diffs against HEAD on \`main\` — unmerged"
            echo "scrape PRs never poison the subsequent baseline."
            echo
            echo "## Regression report"
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "## How to merge"
            echo
            echo "Review the diff, then merge this PR. If the changes are expected (bulk LLM"
            echo "refresh, discovery spike), this is the intended human-review gate."
            echo
            echo "If the changes are clearly bad (LLM hallucination, aggregator outage), close"
            echo "this PR without merging and investigate the scraper."
          } > /tmp/scrape-pr-body.md

          gh pr create \
            --title "scrape: data delta $(date -u +%Y-%m-%d) — review before merge" \
            --body-file /tmp/scrape-pr-body.md \
            --base main \
            --head "$BRANCH"
