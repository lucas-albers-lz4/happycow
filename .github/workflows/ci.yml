name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate data (schema, coverage, parity, hours grammar)
        run: |
          python scripts/validate_data.py
          node scripts/validate_hours.mjs data/happy_hour_data.json

      - name: Hours parser tests
        # No-arg discovery (node 18+); `node --test tests/` fails on some
        # node versions and the glob form needs node 21+.
        run: node --test

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Python unit tests
        run: python -m unittest discover -s tests/python -v

      - name: Venue truth golden eval
        run: python scripts/eval_venue_truth.py
